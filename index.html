<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible Gems – Chronological Bible Reading Plan</title>
<meta name="description" content="A one-year chronological Bible reading plan with saved progress.">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="site-header">
  <h1>Bible Gems – Chronological Bible Reading Plan</h1>
  <div class="progress-wrap">
    <p id="progress-text" class="progress-text" aria-live="polite">Completed: 0 / 365</p>
    <div id="progress-bar" class="progress-bar" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="365" aria-valuenow="0"><span id="progress-fill"></span></div>
    <button type="button" id="reset-btn" class="reset-btn">Reset progress</button>
  </div>
</header>
<main>
  <ol id="readings" class="grid" aria-label="Daily readings"></ol>
  <noscript><p class="notice">This page needs JavaScript to display the reading plan.</p></noscript>
  <p id="error" class="notice" hidden>The readings could not be loaded. Please reload the page.</p>
</main>
<script src="assets/app.js"></script>
</body>
</html>
